<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Consultant Scorecard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --navy:#003B4A; --blue:#3F738D; --icy:#DBECF1; --gray:#EDEDED; --orange:#F68C2C;
  --charcoal:#363534; --dune:#F1EFEB; --clay:#802020; --sage:#91996B; --cloud:#E6EBF2;
  --body:#595959; --ink:#1f2a30; --bg:#F1EFEB; --card:#fff; --line:#E2E2DF;
  --green:#2E7D4F; --green-bg:#E4F2EA; --amber:#B8650F; --amber-bg:#FDEEDC; --red:#802020; --red-bg:#F6E1E1;
  --radius:10px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Aptos,Inter,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
header.top{background:var(--navy);color:#fff;border-bottom:4px solid var(--orange)}
.top-in{max-width:1240px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:36px;height:36px;border-radius:8px;background:var(--orange);color:var(--navy);display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:-.02em}
.brand h1{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em}
.brand p{margin:0;font-size:12px;color:var(--icy);opacity:.85}
#who{display:flex;align-items:center;gap:14px;font-size:14px}
#who small{display:block;color:var(--icy);opacity:.8;font-size:11.5px}
.demo{background:var(--orange);color:var(--navy);font-size:13px}
.demo .top-in{padding:8px 16px}
.demo select{font:inherit;padding:4px 8px;border-radius:6px;border:1px solid var(--navy)}
main{max-width:1240px;margin:0 auto;padding:20px 16px 80px}
.tabs{display:flex;gap:4px;margin:0 0 18px;overflow-x:auto}
.tabs button{font:inherit;font-weight:600;font-size:14px;background:transparent;border:0;border-bottom:3px solid transparent;padding:10px 14px;color:var(--body);cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--navy);border-bottom-color:var(--orange)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin:0 0 18px}
.panel.flush{padding:0;overflow:hidden}
.panel.narrow{max-width:460px;margin:40px auto}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;padding:16px 20px;border-bottom:1px solid var(--line)}
.panel-head h2{margin:0}
h2{font-size:17px;margin:0 0 10px;color:var(--navy);font-weight:700}
h2.big{font-size:22px;margin:0}
h3{font-size:15px;color:var(--navy);margin:20px 0 6px}
p{margin:0 0 12px;color:var(--body)}
.muted{color:var(--body);opacity:.85}.small{font-size:13px}
.count{color:var(--orange);margin-left:4px}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin:0 0 2px}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
code{background:var(--gray);padding:1px 5px;border-radius:4px;color:var(--charcoal)}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--charcoal);margin:0 0 12px}
label small{font-weight:400;color:var(--body)}
input,select{font:inherit;font-size:15px;padding:9px 11px;border:1px solid #cfd3d2;border-radius:8px;background:#fff;color:var(--ink);min-width:0}
input:focus,select:focus{outline:2px solid var(--blue);outline-offset:1px}
.check{flex-direction:row;align-items:center;gap:8px;font-weight:500}
.check input{width:18px;height:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}
.btn{font:inherit;font-weight:600;font-size:14px;padding:9px 16px;border-radius:8px;border:1px solid var(--navy);background:#fff;color:var(--navy);cursor:pointer;display:inline-flex;align-items:center;margin:0}
.btn.primary{background:var(--navy);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.btn.tiny{padding:4px 10px;font-size:12.5px}
.link{font:inherit;background:none;border:0;color:var(--blue);cursor:pointer;text-decoration:underline;padding:4px}
.link.light{color:var(--icy)}
.link.danger{color:var(--clay)}
.err{color:var(--clay);font-weight:600}
.warnbox{background:var(--amber-bg);border-left:4px solid var(--orange);padding:12px 14px;border-radius:6px;margin:12px 0;font-size:14px;color:var(--charcoal)}
.loading{color:var(--body);padding:16px 0}
.pickers{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin:0 0 16px}
.pickers label{margin:0;min-width:180px}
.asof{margin-left:auto;font-size:13px;color:var(--body);padding-bottom:10px}
.card-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:0 0 16px}
.card.store{border-top:4px solid var(--navy)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.tile{border:1px solid var(--line);border-left:5px solid var(--gray);border-radius:8px;padding:12px 14px;background:#fff}
.tile.green{border-left-color:var(--green);background:var(--green-bg)}
.tile.amber{border-left-color:var(--orange);background:var(--amber-bg)}
.tile.red{border-left-color:var(--red);background:var(--red-bg)}
.tl{font-size:12px;font-weight:600;color:var(--charcoal);text-transform:uppercase;letter-spacing:.04em}
.tv{font-size:24px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;margin:2px 0}
.tg{font-size:12px;color:var(--body)}
.cr{display:flex;gap:6px;margin-top:8px}
.cr input{width:80px;padding:4px 8px;font-size:14px}
.tr{font-size:12px;font-weight:600;color:var(--blue);margin-top:4px;font-variant-numeric:tabular-nums}
.rankline{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 18px;background:var(--icy);border-radius:8px;padding:10px 14px;margin:-4px 0 14px}
.rankline .rk{font-size:15px;color:var(--navy)}
.rankline b{font-size:20px}
.tiny-note{font-size:11px;color:var(--body);margin-top:4px}
.scroller{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
.grid th{background:var(--cloud);color:var(--navy);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;text-align:left;padding:10px 12px;white-space:nowrap;font-weight:700}
.grid td{padding:10px 12px;border-top:1px solid var(--line);white-space:nowrap;vertical-align:middle}
.grid .num{text-align:right;font-variant-numeric:tabular-nums}
.grid .goalrow td{background:var(--icy);color:var(--navy);font-size:12.5px;font-weight:600;border-top:0}
.grid .goalrow small{font-weight:400}
.grid tbody tr[data-id]{cursor:pointer}
.grid tbody tr[data-id]:hover td{background:#f7f8f8}
.grid tbody tr.sel td{background:var(--icy)}
.grid .nm{font-weight:600;color:var(--navy)}
.grid .nm small{display:block;font-weight:400;color:var(--body);font-size:11.5px}
.grid td:first-child,.grid th:first-child{position:sticky;left:0;background:inherit}
.grid thead th:first-child{background:var(--cloud)}
.grid tbody td:first-child{background:#fff}
.grid tbody tr.sel td:first-child{background:var(--icy)}
.grid .goalrow td:first-child{background:var(--icy)}
.val{display:inline-block;padding:2px 8px;border-radius:5px;font-weight:600}
.val.green{background:var(--green-bg);color:var(--green)}
.val.amber{background:var(--amber-bg);color:var(--amber)}
.val.red{background:var(--red-bg);color:var(--red)}
.val.none{color:var(--body)}
.grid.goals input{width:110px;text-align:right;padding:6px 8px}
.roster .acts{text-align:right}
.mini{max-width:560px;margin:14px 0 8px}
.mini th,.mini td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left}
.mini .num{text-align:right}
.drop{display:block;border:2px dashed var(--blue);border-radius:10px;padding:26px;text-align:center;background:var(--icy);cursor:pointer;margin:14px 0;font-weight:500;color:var(--navy)}
.drop.over{background:#c9e2ea}
.drop input{display:block;margin:0 auto 8px;max-width:100%}
.formgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:0 16px;align-items:end}
.checks{display:flex;flex-wrap:wrap;gap:4px 18px;margin:6px 0 10px}

.due{color:var(--clay);font-weight:600;font-size:13px}
.ok{color:var(--green);font-weight:600;font-size:13px}
.coach{border-top:4px solid var(--orange)}
.coach h3{margin:22px 0 8px;font-size:15px}
.coach ul{margin:4px 0 8px;padding-left:20px}
.coach.mine .big{font-size:20px}
.fus{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin:0 0 10px}
.fu{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);border-left:5px solid var(--gray);border-radius:8px;padding:10px 14px}
.fu.green{border-left-color:var(--green)}.fu.amber{border-left-color:var(--orange)}.fu.red{border-left-color:var(--red)}
.fu-now{text-align:right}
.focus{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.fcard{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:#fff;min-width:0}
.fcard p{margin:8px 0}
.fhead{display:flex;gap:10px;align-items:flex-start}
.fhead > div{flex:1;min-width:0}
.fnum{flex:none;width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--icy);color:var(--navy);vertical-align:middle}
.pill.alt{background:var(--amber-bg);color:var(--amber)}
.swap{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:12px 0 0}
.chip{font:inherit;font-size:13px;padding:5px 12px;border-radius:999px;border:1px solid var(--blue);background:#fff;color:var(--blue);cursor:pointer}
.chip:disabled{opacity:.4;cursor:default}
.cform{display:grid;gap:0;max-width:760px}
textarea{font:inherit;font-size:15px;padding:9px 11px;border:1px solid #cfd3d2;border-radius:8px;resize:vertical;font-weight:400;color:var(--ink)}
.hist{margin-top:20px;border-top:1px solid var(--line);padding-top:12px}
.hist summary{cursor:pointer;font-weight:600;color:var(--navy)}
.hrow{display:grid;grid-template-columns:200px 1fr auto;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
@media (max-width:640px){.hrow{grid-template-columns:1fr}}
textarea{margin:0 0 14px}
.fieldhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 4px}
.fieldhead label{margin:0}
.mic{font:inherit;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:999px;border:1px solid var(--navy);background:#fff;color:var(--navy);cursor:pointer}
.mic.on{background:var(--clay);border-color:var(--clay);color:#fff;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(128,32,32,.18)}}
@media (prefers-reduced-motion:reduce){.mic.on{animation:none}}
.live{font-size:13px;color:var(--blue);font-style:italic;min-width:0;overflow-wrap:anywhere}
/* minimum standard */
.minbanner{border-radius:10px;padding:14px 18px;margin:0 0 14px;font-size:15px;line-height:1.5}
.minbanner.below{background:var(--red-bg);border:1px solid var(--red);border-left:6px solid var(--red);color:var(--charcoal)}
.minbanner.below b{color:var(--red)}
.minbanner.watch{background:var(--amber-bg);border:1px solid var(--orange);border-left:6px solid var(--orange);color:var(--charcoal)}
.minpanel{border-left:6px solid var(--red)}
.minrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:6px 0}
.flag{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:3px 9px;border-radius:999px}
.flag.below{background:var(--red);color:#fff}
.flag.watch{background:var(--amber-bg);color:var(--amber);border:1px solid var(--orange)}
.flagtxt{display:block;color:var(--red);font-weight:700;font-size:11px}
.pill.minp{background:var(--red);color:#fff}
/* weekly upload */
.pend{border-top:1px solid var(--line);padding-top:12px;margin-top:14px}
.pend h3{margin:0 0 8px}
.assign{background:var(--dune);border-radius:8px;padding:12px;margin:10px 0}
.assign select{font-size:14px;padding:5px 8px;max-width:240px}
.assign .scroller{max-height:420px;overflow:auto}
label.inline{flex-direction:row;align-items:center;gap:8px;margin:0}
.tile.hero{outline:2px solid var(--navy);outline-offset:-1px}
/* roster + team coaching */
.sugg{display:block;color:var(--blue);font-size:11px;font-weight:600}
.sugg.weak{color:var(--amber)}
.alias{display:inline-block;background:var(--cloud);border-radius:999px;padding:1px 4px 1px 9px;margin:2px 2px 2px 0;text-transform:capitalize}
.coach.team{border-top-color:var(--navy)}
.coach.team .fnum{background:var(--orange);color:var(--navy)}
.warnbox .check{margin:8px 0 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:12px 18px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast.bad{background:var(--clay)}
@media (max-width:640px){
  .asof{margin-left:0;padding:0;width:100%}
  .pickers label{min-width:0;flex:1}
  .tv{font-size:21px}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .panel{padding:16px}
}
</style>
</head>
<body>
<div class="demo" id="demoBar" hidden><div class="top-in"><b>Demo mode</b> Sample data only, nothing is saved. View as: <select id="demoRole"></select></div></div>
<header class="top"><div class="top-in">
  <div class="brand"><div class="mark">1915</div><div><h1>Consultant Scorecard</h1><p>1915 South · Sales &amp; Operations</p></div></div>
  <div id="who"></div>
</div></header>
<main id="app"><p class="loading">Loading…</p></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
